<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 112" fill="none"><title>Cotorra puertorriqueña</title><style>
.rise{animation:rise .7s cubic-bezier(.2,.9,.3,1.15) both}
.grip{animation:grip .35s .55s ease-out both}
.head{transform-origin:70px 54px;animation:look 7s 1.4s ease-in-out infinite}
.lid{transform-origin:86px 30px;transform:scaleY(0);animation:blink 4.6s 1.2s infinite}
.chest{transform-origin:68px 96px;animation:breathe 3.2s ease-in-out infinite}
@keyframes rise{from{transform:translateY(34px)}}
@keyframes grip{from{opacity:0;transform:translateY(-4px)}}
@keyframes look{0%,18%,100%{transform:rotate(0)}24%,40%{transform:rotate(-7deg)}48%,64%{transform:rotate(5deg) translateX(1px)}72%{transform:rotate(0)}}
@keyframes blink{0%,94%,100%{transform:scaleY(0)}96.5%{transform:scaleY(1)}}
@keyframes breathe{50%{transform:scale(1.015,1.025)}}
@media (prefers-reduced-motion:reduce){.rise,.grip,.head,.lid,.chest{animation:none}}
