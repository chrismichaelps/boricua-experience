<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 72" fill="none"><title>Cotorra puertorriqueña</title><style>
.peek{animation:rise .65s .25s cubic-bezier(.22,1,.36,1) both}
.head{transform-origin:50px 60px;animation:look 9s 2s ease-in-out infinite}
.lid{transform-origin:50px 38px;transform:scaleY(0);animation:blink 5s 1.4s infinite}
.feet{animation:grip .3s .75s ease-out both}
@keyframes rise{from{transform:translateY(48px)}}
@keyframes grip{from{opacity:0;transform:translateY(-5px)}}
@keyframes look{0%,14%,100%{transform:none}20%,32%{transform:rotate(-9deg)}38%,52%{transform:rotate(7deg)}58%,64%{transform:translateY(7px)}70%{transform:none}}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.peek,.head,.lid,.feet{animation:none}}
