roke="#fff" stroke-width="2"/><text x="60" y="98.6" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#fff">10</text></g></svg>
