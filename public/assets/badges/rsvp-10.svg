<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" class="bx-badge bx-badge-rare" data-badge="rsvp-10"><style>.b-float{animation:b-float 4.8s ease-in-out infinite}
.b-sway{animation:b-sway 5.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.b-pulse{animation:b-pulse 3.6s ease-in-out infinite}
.b-twinkle{animation:b-twinkle 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.b-spin{animation:b-spin 28s linear infinite;transform-origin:60px 60px}
.b-blink{animation:b-blink 5.2s 1.2s infinite;transform-box:fill-box;transform-origin:center;transform:scaleY(0)}
@keyframes b-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes b-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes b-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes b-twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@keyframes b-spin{to{transform:rotate(360deg)}}
@keyframes b-blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.b-float,.b-sway,.b-pulse,.b-twinkle,.b-spin,.b-blink{animation:none}}</style><defs><radialGradient id="bx-rsvp-10-bg" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="#f6fbff"/><stop offset="1" stop-color="#d3e6fb"/></radialGradient><linearGradient id="bx-rsvp-10-ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cbcff"/><stop offset=".55" stop-color="#1878ec"/><stop offset="1" stop-color="#0f5cc0"/></linearGradient><clipPath id="bx-rsvp-10-clip"><circle cx="60" cy="60" r="47"/></clipPath><radialGradient id="bx-rsvp-10-crown" cx=".4" cy=".28" r=".85"><stop offset="0" stop-color="#6fc055"/><stop offset=".65" stop-color="#3f9440"/><stop offset="1" stop-color="#2d7a33"/></radialGradient></defs><circle cx="60" cy="60" r="57" fill="url(#bx-rsvp-10-ring)"/><circle cx="60" cy="60" r="50" fill="#fff"/><circle cx="60" cy="60" r="47" fill="url(#bx-rsvp-10-bg)"/><g clip-path="url(#bx-rsvp-10-clip)"><circle class="b-pulse" cx="60" cy="58" r="30" fill="#7cbcff" opacity=".35"/><g class="b-float"><circle cx="44" cy="46" r="8" fill="#8a5a2b"/><path d="M30 76C30 64 36 58 44 58C52 58 58 64 58 76Z" fill="#1878ec"/><circle cx="76" cy="46" r="8" fill="#c99a5b"/><path d="M62 76C62 64 68 58 76 58C84 58 90 64 90 76Z" fill="#d93a31"/><circle cx="60" cy="40" r="9" fill="#a0743c"/><path d="M44 78C44 62 51 54 60 54C69 54 76 62 76 78Z" fill="#3f9440"/></g></g><path class="b-twinkle" style="animation-delay:0s" fill="#5aa6f5" d="M24 29Q25.1 32.9 29 34Q25.1 35.1 24 39Q22.9 35.1 19 34Q22.9 32.9 24 29Z"/><path class="b-twinkle" style="animation-delay:0.7s" fill="#5aa6f5" d="M94 25Q95.1 28.9 99 30Q95.1 31.1 94 35Q92.9 31.1 89 30Q92.9 28.9 94 25Z"/><g><rect x="40" y="86" width="40" height="17" rx="8.5" fill="url(#bx-rsvp-10-ring)" stroke="#fff" stroke-width="2"/><text x="60" y="98.6" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#fff">10</text></g></svg>
