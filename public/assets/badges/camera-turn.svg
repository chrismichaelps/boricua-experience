<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" class="bx-badge bx-badge-common" data-badge="camera-turn"><style>.b-float{animation:b-float 4.8s ease-in-out infinite}
.b-sway{animation:b-sway 5.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.b-pulse{animation:b-pulse 3.6s ease-in-out infinite}
.b-twinkle{animation:b-twinkle 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.b-spin{animation:b-spin 28s linear infinite;transform-origin:60px 60px}
.b-blink{animation:b-blink 5.2s 1.2s infinite;transform-box:fill-box;transform-origin:center;transform:scaleY(0)}
@keyframes b-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes b-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes b-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes b-twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@keyframes b-spin{to{transform:rotate(360deg)}}
@keyframes b-blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.b-float,.b-sway,.b-pulse,.b-twinkle,.b-spin,.b-blink{animation:none}}</style><defs><linearGradient id="bx-camera-turn-ring" x1=".2" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#8fd16f"/><stop offset=".5" stop-color="#3f9440"/><stop offset="1" stop-color="#2d7a33"/></linearGradient><clipPath id="bx-camera-turn-clip"><circle cx="60" cy="60" r="46.4"/></clipPath><radialGradient id="bx-camera-turn-crown" cx=".4" cy=".28" r=".85"><stop offset="0" stop-color="#6fc055"/><stop offset=".65" stop-color="#3f9440"/><stop offset="1" stop-color="#2d7a33"/></radialGradient></defs><circle cx="60" cy="60" r="56.5" fill="#2d7a33"/><circle cx="60" cy="59" r="55.2" fill="url(#bx-camera-turn-ring)"/><path d="M17.5 46A44.5 44.5 0 0 1 102.5 46" fill="none" stroke="#8fd16f" stroke-width="2.2" stroke-linecap="round" opacity=".9"/><circle cx="60" cy="60" r="49.4" fill="#2d7a33"/><circle cx="60" cy="60" r="48.2" fill="#fff8e6"/><g clip-path="url(#bx-camera-turn-clip)"><circle cx="60" cy="60" r="46.4" fill="#f3f9ea"/><path d="M12 80C24 70 36 68 48 72C58 75 66 66 78 66C90 66 100 72 108 78V108H12Z" fill="#cfe8bb"/><path d="M12 88C30 80 46 82 62 86C78 90 92 82 108 84V108H12Z" fill="#8fd16f" opacity=".38"/><ellipse cx="60" cy="85" rx="22" ry="3.6" fill="#26372c" opacity=".13"/><g transform="translate(0 2)"><g transform="translate(37 42.519999999999996) scale(0.46)"><path d="M16 62C14 35 29 14 50 14C71 14 86 35 84 62Z" fill="url(#bx-camera-turn-crown)"/><path d="M44 16C45 10 51 8 55 12C52 12 49 13 47 17Z" fill="#2d7a33"/><path d="M39 31C43 28.5 57 28.5 61 31L59.5 34.5C55 32.8 45 32.8 40.5 34.5Z" fill="#d93a31"/><circle cx="35" cy="38" r="7.2" fill="#f7f4ea"/><circle cx="65" cy="38" r="7.2" fill="#f7f4ea"/><circle cx="35.6" cy="38.4" r="4.3" fill="#8a5a2b"/><circle cx="64.4" cy="38.4" r="4.3" fill="#8a5a2b"/><circle cx="35.8" cy="38.6" r="2.7" fill="#1d140e"/><circle cx="64.2" cy="38.6" r="2.7" fill="#1d140e"/><circle cx="37.1" cy="37.2" r="1.1" fill="#fff"/><circle cx="65.5" cy="37.2" r="1.1" fill="#fff"/><g class="b-blink" fill="#3f9440"><circle cx="35" cy="38" r="7.6"/><circle cx="65" cy="38" r="7.6"/></g><path d="M42.5 37C42.5 33.5 57.5 33.5 57.5 37C57.5 45.5 54.5 52 50 56C45.5 52 42.5 45.5 42.5 37Z" fill="#f1e6c8"/><path d="M50 56C48.6 54.6 47.6 53 47 51.4C48.8 52.6 51.2 52.6 53 51.4C52.4 53 51.4 54.6 50 56Z" fill="#c7b48d"/></g><g class="b-spin"><path d="M28 60A32 14 0 0 0 92 60" fill="none" stroke="#1878ec" stroke-width="3.5" stroke-linecap="round"/><path d="M88 52L93 61L83 63" fill="none" stroke="#1878ec" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g></g></g></svg>
