<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" class="bx-badge bx-badge-rare" data-badge="mountain-coffee"><style>.b-float{animation:b-float 4.8s ease-in-out infinite}
.b-sway{animation:b-sway 5.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.b-pulse{animation:b-pulse 3.6s ease-in-out infinite}
.b-twinkle{animation:b-twinkle 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.b-spin{animation:b-spin 28s linear infinite;transform-origin:60px 60px}
.b-blink{animation:b-blink 5.2s 1.2s infinite;transform-box:fill-box;transform-origin:center;transform:scaleY(0)}
@keyframes b-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes b-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes b-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes b-twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@keyframes b-spin{to{transform:rotate(360deg)}}
@keyframes b-blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.b-float,.b-sway,.b-pulse,.b-twinkle,.b-spin,.b-blink{animation:none}}</style><defs><radialGradient id="bx-mountain-coffee-bg" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="#f6fbff"/><stop offset="1" stop-color="#d3e6fb"/></radialGradient><linearGradient id="bx-mountain-coffee-ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cbcff"/><stop offset=".55" stop-color="#1878ec"/><stop offset="1" stop-color="#0f5cc0"/></linearGradient><clipPath id="bx-mountain-coffee-clip"><circle cx="60" cy="60" r="47"/></clipPath><radialGradient id="bx-mountain-coffee-crown" cx=".4" cy=".28" r=".85"><stop offset="0" stop-color="#6fc055"/><stop offset=".65" stop-color="#3f9440"/><stop offset="1" stop-color="#2d7a33"/></radialGradient></defs><circle cx="60" cy="60" r="57" fill="url(#bx-mountain-coffee-ring)"/><circle cx="60" cy="60" r="50" fill="#fff"/><circle cx="60" cy="60" r="47" fill="url(#bx-mountain-coffee-bg)"/><g clip-path="url(#bx-mountain-coffee-clip)"><circle class="b-pulse" cx="60" cy="58" r="30" fill="#7cbcff" opacity=".35"/><path d="M22 72L40 46L52 60L66 40L98 72Z" fill="#3f9440"/><path d="M40 46L46 54M66 40L72 50" stroke="#6fc055" stroke-width="2.5" stroke-linecap="round"/><path d="M40 62H76V70C76 80 68 86 58 86C48 86 40 80 40 70Z" fill="#8a5a2b"/><path d="M76 66C84 66 84 76 76 76" stroke="#8a5a2b" stroke-width="4" fill="none"/><path d="M40 62H76" stroke="#6b4423" stroke-width="3" stroke-linecap="round"/><g class="b-float"><path class="b-pulse" style="animation-delay:0s" d="M50 56C46 50 54 46 50 40" stroke="#f1e6c8" stroke-width="2.6" stroke-linecap="round" fill="none"/><path class="b-pulse" style="animation-delay:0.7s" d="M58 56C54 50 62 46 58 40" stroke="#f1e6c8" stroke-width="2.6" stroke-linecap="round" fill="none"/><path class="b-pulse" style="animation-delay:1.4s" d="M66 56C62 50 70 46 66 40" stroke="#f1e6c8" stroke-width="2.6" stroke-linecap="round" fill="none"/></g></g><path class="b-twinkle" style="animation-delay:0s" fill="#5aa6f5" d="M24 29Q25.1 32.9 29 34Q25.1 35.1 24 39Q22.9 35.1 19 34Q22.9 32.9 24 29Z"/><path class="b-twinkle" style="animation-delay:0.7s" fill="#5aa6f5" d="M94 25Q95.1 28.9 99 30Q95.1 31.1 94 35Q92.9 31.1 89 30Q92.9 28.9 94 25Z"/></svg>
