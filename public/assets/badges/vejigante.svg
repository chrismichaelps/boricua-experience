<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" class="bx-badge bx-badge-rare" data-badge="vejigante"><style>.b-float{animation:b-float 4.8s ease-in-out infinite}
.b-sway{animation:b-sway 5.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.b-pulse{animation:b-pulse 3.6s ease-in-out infinite}
.b-twinkle{animation:b-twinkle 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.b-spin{animation:b-spin 28s linear infinite;transform-origin:60px 60px}
.b-blink{animation:b-blink 5.2s 1.2s infinite;transform-box:fill-box;transform-origin:center;transform:scaleY(0)}
@keyframes b-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes b-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes b-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes b-twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@keyframes b-spin{to{transform:rotate(360deg)}}
@keyframes b-blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.b-float,.b-sway,.b-pulse,.b-twinkle,.b-spin,.b-blink{animation:none}}</style><defs><radialGradient id="bx-vejigante-bg" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="#f6fbff"/><stop offset="1" stop-color="#d3e6fb"/></radialGradient><linearGradient id="bx-vejigante-ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cbcff"/><stop offset=".55" stop-color="#1878ec"/><stop offset="1" stop-color="#0f5cc0"/></linearGradient><clipPath id="bx-vejigante-clip"><circle cx="60" cy="60" r="47"/></clipPath><radialGradient id="bx-vejigante-crown" cx=".4" cy=".28" r=".85"><stop offset="0" stop-color="#6fc055"/><stop offset=".65" stop-color="#3f9440"/><stop offset="1" stop-color="#2d7a33"/></radialGradient></defs><circle cx="60" cy="60" r="57" fill="url(#bx-vejigante-ring)"/><circle cx="60" cy="60" r="50" fill="#fff"/><circle cx="60" cy="60" r="47" fill="url(#bx-vejigante-bg)"/><g clip-path="url(#bx-vejigante-clip)"><circle class="b-pulse" cx="60" cy="58" r="30" fill="#7cbcff" opacity=".35"/><g class="b-float"><path d="M40 44L30 26L46 36ZM50 36L46 18L58 33ZM70 36L74 18L62 33ZM80 44L90 26L74 36ZM60 34L60 14L66 32Z" fill="#f2b630" stroke="#a86c00" stroke-width="1.2" stroke-linejoin="round"/><path d="M36 50C36 36 48 30 60 30C72 30 84 36 84 50C84 66 74 80 60 80C46 80 36 66 36 50Z" fill="#d93a31"/><circle cx="49" cy="50" r="6" fill="#f7f4ea"/><circle cx="71" cy="50" r="6" fill="#f7f4ea"/><circle cx="49" cy="50" r="2.6" fill="#26372c"/><circle cx="71" cy="50" r="2.6" fill="#26372c"/><path d="M48 66Q60 74 72 66Q60 70 48 66Z" fill="#f7f4ea"/><path d="M52 66V69M57 67V71M63 67V71M68 66V69" stroke="#26372c" stroke-width="1.4"/><circle cx="42" cy="40" r="2.2" fill="#f2b630"/><circle cx="78" cy="40" r="2.2" fill="#f2b630"/><circle cx="60" cy="39" r="2.2" fill="#f2b630"/><circle cx="44" cy="62" r="2.2" fill="#f2b630"/><circle cx="76" cy="62" r="2.2" fill="#f2b630"/></g></g><path class="b-twinkle" style="animation-delay:0s" fill="#5aa6f5" d="M24 29Q25.1 32.9 29 34Q25.1 35.1 24 39Q22.9 35.1 19 34Q22.9 32.9 24 29Z"/><path class="b-twinkle" style="animation-delay:0.7s" fill="#5aa6f5" d="M94 25Q95.1 28.9 99 30Q95.1 31.1 94 35Q92.9 31.1 89 30Q92.9 28.9 94 25Z"/></svg>
