<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" class="bx-badge bx-badge-rare" data-badge="flamboyan-trail"><style>.b-float{animation:b-float 4.8s ease-in-out infinite}
.b-sway{animation:b-sway 5.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.b-pulse{animation:b-pulse 3.6s ease-in-out infinite}
.b-twinkle{animation:b-twinkle 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.b-spin{animation:b-spin 28s linear infinite;transform-origin:60px 60px}
.b-blink{animation:b-blink 5.2s 1.2s infinite;transform-box:fill-box;transform-origin:center;transform:scaleY(0)}
@keyframes b-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes b-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes b-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes b-twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@keyframes b-spin{to{transform:rotate(360deg)}}
@keyframes b-blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.b-float,.b-sway,.b-pulse,.b-twinkle,.b-spin,.b-blink{animation:none}}</style><defs><radialGradient id="bx-flamboyan-trail-bg" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="#f6fbff"/><stop offset="1" stop-color="#d3e6fb"/></radialGradient><linearGradient id="bx-flamboyan-trail-ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cbcff"/><stop offset=".55" stop-color="#1878ec"/><stop offset="1" stop-color="#0f5cc0"/></linearGradient><clipPath id="bx-flamboyan-trail-clip"><circle cx="60" cy="60" r="47"/></clipPath><radialGradient id="bx-flamboyan-trail-crown" cx=".4" cy=".28" r=".85"><stop offset="0" stop-color="#6fc055"/><stop offset=".65" stop-color="#3f9440"/><stop offset="1" stop-color="#2d7a33"/></radialGradient></defs><circle cx="60" cy="60" r="57" fill="url(#bx-flamboyan-trail-ring)"/><circle cx="60" cy="60" r="50" fill="#fff"/><circle cx="60" cy="60" r="47" fill="url(#bx-flamboyan-trail-bg)"/><g clip-path="url(#bx-flamboyan-trail-clip)"><circle class="b-pulse" cx="60" cy="58" r="30" fill="#7cbcff" opacity=".35"/><path d="M60 84V60M60 66L50 58M60 64L71 56" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/><g class="b-sway"><path d="M30 54C30 40 44 32 60 32C76 32 90 40 90 54C80 60 40 60 30 54Z" fill="#e8573f"/><path d="M36 50C42 44 52 42 60 42C70 42 80 45 85 51" stroke="#d93a31" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="40" cy="46" r="2.4" fill="#f7d24a"/><circle cx="52" cy="38" r="2.4" fill="#f7d24a"/><circle cx="66" cy="37" r="2.4" fill="#f7d24a"/><circle cx="78" cy="45" r="2.4" fill="#f7d24a"/><circle cx="58" cy="50" r="2.4" fill="#f7d24a"/></g><path d="M28 84H92" stroke="#54a83d" stroke-width="3" stroke-linecap="round"/></g><path class="b-twinkle" style="animation-delay:0s" fill="#5aa6f5" d="M24 29Q25.1 32.9 29 34Q25.1 35.1 24 39Q22.9 35.1 19 34Q22.9 32.9 24 29Z"/><path class="b-twinkle" style="animation-delay:0.7s" fill="#5aa6f5" d="M94 25Q95.1 28.9 99 30Q95.1 31.1 94 35Q92.9 31.1 89 30Q92.9 28.9 94 25Z"/></svg>
