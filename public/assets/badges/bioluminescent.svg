<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" class="bx-badge bx-badge-epic" data-badge="bioluminescent"><style>.b-float{animation:b-float 4.8s ease-in-out infinite}
.b-sway{animation:b-sway 5.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.b-pulse{animation:b-pulse 3.6s ease-in-out infinite}
.b-twinkle{animation:b-twinkle 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.b-spin{animation:b-spin 28s linear infinite;transform-origin:60px 60px}
.b-blink{animation:b-blink 5.2s 1.2s infinite;transform-box:fill-box;transform-origin:center;transform:scaleY(0)}
@keyframes b-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes b-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes b-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes b-twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@keyframes b-spin{to{transform:rotate(360deg)}}
@keyframes b-blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.b-float,.b-sway,.b-pulse,.b-twinkle,.b-spin,.b-blink{animation:none}}</style><defs><radialGradient id="bx-bioluminescent-bg" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="#fcf6ff"/><stop offset="1" stop-color="#e4d3fb"/></radialGradient><linearGradient id="bx-bioluminescent-ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c3a3f5"/><stop offset=".55" stop-color="#7b4bd1"/><stop offset="1" stop-color="#55309f"/></linearGradient><clipPath id="bx-bioluminescent-clip"><circle cx="60" cy="60" r="47"/></clipPath><radialGradient id="bx-bioluminescent-crown" cx=".4" cy=".28" r=".85"><stop offset="0" stop-color="#6fc055"/><stop offset=".65" stop-color="#3f9440"/><stop offset="1" stop-color="#2d7a33"/></radialGradient></defs><circle cx="60" cy="60" r="57" fill="url(#bx-bioluminescent-ring)"/><circle cx="60" cy="60" r="50" fill="#fff"/><circle cx="60" cy="60" r="47" fill="url(#bx-bioluminescent-bg)"/><g clip-path="url(#bx-bioluminescent-clip)"><circle class="b-pulse" cx="60" cy="58" r="30" fill="#c3a3f5" opacity=".35"/><circle cx="60" cy="60" r="40" fill="#163a5c" opacity=".18"/><path d="M76 30A11 11 0 1 0 86 44A9 9 0 1 1 76 30Z" fill="#ffd257"/><path d="M24 62Q36 54 48 62T72 62T96 62V86H24Z" fill="#163a5c"/><path d="M24 70Q36 64 48 70T72 70T96 70" stroke="#3ad1e8" stroke-width="2.6" fill="none" class="b-pulse"/><circle class="b-twinkle" style="animation-delay:0s" cx="36" cy="76" r="2.2" fill="#7ef3ff"/><circle class="b-twinkle" style="animation-delay:0.5s" cx="52" cy="80" r="2.2" fill="#7ef3ff"/><circle class="b-twinkle" style="animation-delay:1s" cx="66" cy="75" r="2.2" fill="#7ef3ff"/><circle class="b-twinkle" style="animation-delay:1.5s" cx="80" cy="79" r="2.2" fill="#7ef3ff"/><circle class="b-twinkle" style="animation-delay:2s" cx="44" cy="69" r="2.2" fill="#7ef3ff"/><circle class="b-twinkle" style="animation-delay:0.8s" cx="72" cy="68" r="2.2" fill="#7ef3ff"/></g><path class="b-twinkle" style="animation-delay:0s" fill="#a77ce8" d="M24 29Q25.1 32.9 29 34Q25.1 35.1 24 39Q22.9 35.1 19 34Q22.9 32.9 24 29Z"/><path class="b-twinkle" style="animation-delay:0.7s" fill="#a77ce8" d="M94 25Q95.1 28.9 99 30Q95.1 31.1 94 35Q92.9 31.1 89 30Q92.9 28.9 94 25Z"/><path class="b-twinkle" style="animation-delay:1.4s" fill="#a77ce8" d="M98 73Q99.1 76.9 103 78Q99.1 79.1 98 83Q96.9 79.1 93 78Q96.9 76.9 98 73Z"/></svg>
