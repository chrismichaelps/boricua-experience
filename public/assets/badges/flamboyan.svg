<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" class="bx-badge bx-badge-common" data-badge="flamboyan"><style>.b-float{animation:b-float 4.8s ease-in-out infinite}
.b-sway{animation:b-sway 5.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.b-pulse{animation:b-pulse 3.6s ease-in-out infinite}
.b-twinkle{animation:b-twinkle 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.b-spin{animation:b-spin 28s linear infinite;transform-origin:60px 60px}
.b-blink{animation:b-blink 5.2s 1.2s infinite;transform-box:fill-box;transform-origin:center;transform:scaleY(0)}
@keyframes b-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes b-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes b-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes b-twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@keyframes b-spin{to{transform:rotate(360deg)}}
@keyframes b-blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.b-float,.b-sway,.b-pulse,.b-twinkle,.b-spin,.b-blink{animation:none}}</style><defs><linearGradient id="bx-flamboyan-ring" x1=".2" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#8fd16f"/><stop offset=".5" stop-color="#3f9440"/><stop offset="1" stop-color="#2d7a33"/></linearGradient><clipPath id="bx-flamboyan-clip"><circle cx="60" cy="60" r="46.4"/></clipPath><radialGradient id="bx-flamboyan-crown" cx=".4" cy=".28" r=".85"><stop offset="0" stop-color="#6fc055"/><stop offset=".65" stop-color="#3f9440"/><stop offset="1" stop-color="#2d7a33"/></radialGradient></defs><circle cx="60" cy="60" r="56.5" fill="#2d7a33"/><circle cx="60" cy="59" r="55.2" fill="url(#bx-flamboyan-ring)"/><path d="M17.5 46A44.5 44.5 0 0 1 102.5 46" fill="none" stroke="#8fd16f" stroke-width="2.2" stroke-linecap="round" opacity=".9"/><circle cx="60" cy="60" r="49.4" fill="#2d7a33"/><circle cx="60" cy="60" r="48.2" fill="#fff8e6"/><g clip-path="url(#bx-flamboyan-clip)"><circle cx="60" cy="60" r="46.4" fill="#f3f9ea"/><path d="M12 80C24 70 36 68 48 72C58 75 66 66 78 66C90 66 100 72 108 78V108H12Z" fill="#cfe8bb"/><path d="M12 88C30 80 46 82 62 86C78 90 92 82 108 84V108H12Z" fill="#8fd16f" opacity=".38"/><ellipse cx="60" cy="85" rx="22" ry="3.6" fill="#26372c" opacity=".13"/><g transform="translate(0 2)"><g class="b-sway"><path d="M60 84V64" stroke="#2d7a33" stroke-width="3.5" stroke-linecap="round"/><path d="M60 72C52 70 46 72 42 78C50 80 56 78 60 72ZM60 70C68 66 74 68 78 74C70 76 64 75 60 70Z" fill="#54a83d"/><ellipse cx="60" cy="38" rx="9" ry="13" fill="#e8573f" transform="rotate(0 60 50)"/><ellipse cx="60" cy="38" rx="9" ry="13" fill="#e8573f" transform="rotate(72 60 50)"/><ellipse cx="60" cy="38" rx="9" ry="13" fill="#e8573f" transform="rotate(144 60 50)"/><ellipse cx="60" cy="38" rx="9" ry="13" fill="#e8573f" transform="rotate(216 60 50)"/><ellipse cx="60" cy="38" rx="9" ry="13" fill="#e8573f" transform="rotate(288 60 50)"/><ellipse cx="60" cy="38" rx="5" ry="9" fill="#f7d24a" transform="rotate(0 60 50)"/><circle cx="60" cy="50" r="6" fill="#d93a31"/><path d="M60 50L56 40M60 50L64 41M60 50L60 38" stroke="#f7d24a" stroke-width="1.6" stroke-linecap="round"/></g></g></g></svg>
