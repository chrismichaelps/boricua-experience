<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" class="bx-badge bx-badge-common" data-badge="coqui"><style>.b-float{animation:b-float 4.8s ease-in-out infinite}
.b-sway{animation:b-sway 5.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.b-pulse{animation:b-pulse 3.6s ease-in-out infinite}
.b-twinkle{animation:b-twinkle 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.b-spin{animation:b-spin 28s linear infinite;transform-origin:60px 60px}
.b-blink{animation:b-blink 5.2s 1.2s infinite;transform-box:fill-box;transform-origin:center;transform:scaleY(0)}
@keyframes b-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes b-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes b-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes b-twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@keyframes b-spin{to{transform:rotate(360deg)}}
@keyframes b-blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.b-float,.b-sway,.b-pulse,.b-twinkle,.b-spin,.b-blink{animation:none}}</style><defs><radialGradient id="bx-coqui-bg" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="#fffdf5"/><stop offset="1" stop-color="#e4f1d6"/></radialGradient><linearGradient id="bx-coqui-ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fd16f"/><stop offset=".55" stop-color="#3f9440"/><stop offset="1" stop-color="#2d7a33"/></linearGradient><clipPath id="bx-coqui-clip"><circle cx="60" cy="60" r="47"/></clipPath><radialGradient id="bx-coqui-crown" cx=".4" cy=".28" r=".85"><stop offset="0" stop-color="#6fc055"/><stop offset=".65" stop-color="#3f9440"/><stop offset="1" stop-color="#2d7a33"/></radialGradient></defs><circle cx="60" cy="60" r="57" fill="url(#bx-coqui-ring)"/><circle cx="60" cy="60" r="50" fill="#fff"/><circle cx="60" cy="60" r="47" fill="url(#bx-coqui-bg)"/><g clip-path="url(#bx-coqui-clip)"><circle class="b-pulse" cx="60" cy="58" r="30" fill="#8fd16f" opacity=".35"/><g class="b-float"><ellipse cx="60" cy="74" rx="22" ry="6" fill="#54a83d" opacity=".45"/><path d="M42 70C40 58 48 46 60 46C72 46 80 58 78 70C72 74 48 74 42 70Z" fill="#b07a3a"/><path d="M47 69C44 72 40 73 37 72M73 69C76 72 80 73 83 72" stroke="#8a5a2b" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="50" cy="46" r="7" fill="#b07a3a"/><circle cx="70" cy="46" r="7" fill="#b07a3a"/><circle cx="50" cy="45" r="4.4" fill="#26372c"/><circle cx="70" cy="45" r="4.4" fill="#26372c"/><circle cx="51.3" cy="43.6" r="1.3" fill="#fff"/><circle cx="71.3" cy="43.6" r="1.3" fill="#fff"/><path d="M53 58Q60 62 67 58" stroke="#6b4423" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M48 62Q52 66 56 64M64 64Q68 66 72 62" stroke="#c99a5b" stroke-width="2" stroke-linecap="round" fill="none"/></g><g class="b-pulse"><path d="M82 34Q88 38 82 42M86 30Q95 38 86 46" stroke="#1878ec" stroke-width="2.5" stroke-linecap="round" fill="none"/></g></g><path class="b-twinkle" style="animation-delay:0s" fill="#6fc055" d="M24 29Q25.1 32.9 29 34Q25.1 35.1 24 39Q22.9 35.1 19 34Q22.9 32.9 24 29Z"/></svg>
