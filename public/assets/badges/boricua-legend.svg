l="#fff3c4" transform="rotate(330 60 60)"/></g><circle class="b-pulse" cx="60" cy="58" r="30" fill="#ffe28a" opacity=".35"/><g transform="translate(31.999999999999996 40.72) scale(0.56)"><path d="M16 62C14 35 29 14 50 14C71 14 86 35 84 62Z" fill="url(#bx-boricua-legend-crown)"/><path d="M44 16C45 10 51 8 55 12C52 12 49 13 47 17Z" fill="#2d7a33"/><path d="M39 31C43 28.5 57 28.5 61 31L59.5 34.5C55 32.8 45 32.8 40.5 34.5Z" fill="#d93a31"/><circle cx="35" cy="38" r="7.2" fill="#f7f4ea"/><circle cx="65" cy="38" r="7.2" fill="#f7f4ea"/><circle cx="35.6" cy="38.4" r="4.3" fill="#8a5a2b"/><circle cx="64.4" cy="38.4" r="4.3" fill="#8a5a2b"/><circle cx="35.8" cy="38.6" r="2.7" fill="#1d140e"/><circle cx="64.2" cy="38.6" r="2.7" fill="#1d140e"/><circle cx="37.1" cy="37.2" r="1.1" fill="#fff"/><circle cx="65.5" cy="37.2" r="1.1" fill="#fff"/><g class="b-blink" fill="#3f9440"><circle cx="35" cy="38" r="7.6"/><circle cx="65" cy="38" r="7.6"/></g><path d="M42.5 37C42.5 33.5 57.5 33.5 57.5 37C57.5 45.5 54.5 52 50 56C45.5 52 42.5 45.5 42.5 37Z" fill="#f1e6c8"/><path d="M50 56C48.6 54.6 47.6 53 47 51.4C48.8 52.6 51.2 52.6 53 51.4C52.4 53 51.4 54.6 50 56Z" fill="#c7b48d"/></g><path class="b-float" d="M44 34L48 24L54 31L60 21L66 31L72 24L76 34Z" fill="#f2b630" stroke="#a86c00" stroke-width="1.5" stroke-linejoin="round"/></g><path class="b-twinkle" style="animation-delay:0s" fill="#f2b630" d="M24 29Q25.1 32.9 29 34Q25.1 35.1 24 39Q22.9 35.1 19 34Q22.9 32.9 24 29Z"/><path class="b-twinkle" style="animation-delay:0.7s" fill="#f2b630" d="M94 25Q95.1 28.9 99 30Q95.1 31.1 94 35Q92.9 31.1 89 30Q92.9 28.9 94 25Z"/><path class="b-twinkle" style="animation-delay:1.4s" fill="#f2b630" d="M98 73Q99.1 76.9 103 78Q99.1 79.1 98 83Q96.9 79.1 93 78Q96.9 76.9 98 73Z"/><path class="b-twinkle" style="animation-delay:2.0999999999999996s" fill="#f2b630" d="M22 77Q23.1 80.9 27 82Q23.1 83.1 22 87Q20.9 83.1 17 82Q20.9 80.9 22 77Z"/></svg>
