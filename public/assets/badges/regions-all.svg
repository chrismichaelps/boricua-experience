<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" class="bx-badge bx-badge-epic" data-badge="regions-all"><style>.b-float{animation:b-float 4.8s ease-in-out infinite}
.b-sway{animation:b-sway 5.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.b-pulse{animation:b-pulse 3.6s ease-in-out infinite}
.b-twinkle{animation:b-twinkle 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.b-spin{animation:b-spin 28s linear infinite;transform-origin:60px 60px}
.b-blink{animation:b-blink 5.2s 1.2s infinite;transform-box:fill-box;transform-origin:center;transform:scaleY(0)}
@keyframes b-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes b-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes b-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes b-twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@keyframes b-spin{to{transform:rotate(360deg)}}
@keyframes b-blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.b-float,.b-sway,.b-pulse,.b-twinkle,.b-spin,.b-blink{animation:none}}</style><defs><radialGradient id="bx-regions-all-bg" cx=".38" cy=".3" r=".85"><stop offset="0" stop-color="#fcf6ff"/><stop offset="1" stop-color="#e4d3fb"/></radialGradient><linearGradient id="bx-regions-all-ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c3a3f5"/><stop offset=".55" stop-color="#7b4bd1"/><stop offset="1" stop-color="#55309f"/></linearGradient><clipPath id="bx-regions-all-clip"><circle cx="60" cy="60" r="47"/></clipPath><radialGradient id="bx-regions-all-crown" cx=".4" cy=".28" r=".85"><stop offset="0" stop-color="#6fc055"/><stop offset=".65" stop-color="#3f9440"/><stop offset="1" stop-color="#2d7a33"/></radialGradient></defs><circle cx="60" cy="60" r="57" fill="url(#bx-regions-all-ring)"/><circle cx="60" cy="60" r="50" fill="#fff"/><circle cx="60" cy="60" r="47" fill="url(#bx-regions-all-bg)"/><g clip-path="url(#bx-regions-all-clip)"><circle class="b-pulse" cx="60" cy="58" r="30" fill="#c3a3f5" opacity=".35"/><g class="b-float"><path d="M26 58C30 52 38 52 44 50C52 48 58 46 66 47C74 48 82 47 88 50C92 52 92 58 88 60C82 62 76 62 70 64C62 66 54 66 46 65C38 64 30 63 27 61Z" fill="#54a83d" stroke="#2d7a33" stroke-width="2" stroke-linejoin="round"/><path d="M40 57Q52 52 62 56T82 55" stroke="#2d7a33" stroke-width="1.6" fill="none" opacity=".6"/><ellipse cx="93" cy="62" rx="3.4" ry="1.8" fill="#54a83d"/><ellipse cx="95" cy="55" rx="2.2" ry="1.6" fill="#54a83d"/></g><path d="M24 74Q42 70 60 74T96 74" stroke="#1878ec" stroke-width="2.4" fill="none" opacity=".55" class="b-pulse"/></g><path class="b-twinkle" style="animation-delay:0s" fill="#a77ce8" d="M24 29Q25.1 32.9 29 34Q25.1 35.1 24 39Q22.9 35.1 19 34Q22.9 32.9 24 29Z"/><path class="b-twinkle" style="animation-delay:0.7s" fill="#a77ce8" d="M94 25Q95.1 28.9 99 30Q95.1 31.1 94 35Q92.9 31.1 89 30Q92.9 28.9 94 25Z"/><path class="b-twinkle" style="animation-delay:1.4s" fill="#a77ce8" d="M98 73Q99.1 76.9 103 78Q99.1 79.1 98 83Q96.9 79.1 93 78Q96.9 76.9 98 73Z"/><g><rect x="45" y="86" width="30" height="17" rx="8.5" fill="url(#bx-regions-all-ring)" stroke="#fff" stroke-width="2"/><text x="60" y="98.6" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#fff">7</text></g></svg>
