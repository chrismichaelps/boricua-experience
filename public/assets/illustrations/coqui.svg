<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><title>Coquí</title><style>.hop{animation:hop 2.8s ease-in-out infinite}.eyes{transform-origin:60px 42px;animation:blink 4s infinite}.sac{transform-box:fill-box;transform-origin:center;animation:sing 2.8s ease-in-out infinite}@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-8px)}}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}@keyframes sing{0%,60%,100%{transform:scale(1)}70%{transform:scale(1.6,1.4)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><radialGradient id="c" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#e6c690"/><stop offset=".6" stop-color="#b98a4e"/><stop offset="1" stop-color="#8a6232"/></radialGradient><radialGradient id="w" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e8ecef"/></radialGradient></defs><ellipse cx="60" cy="108" rx="30" ry="5" fill="#2b2b2b" opacity=".12"/><g class="hop"><ellipse cx="60" cy="72" rx="40" ry="30" fill="url(#c)"/><circle cx="38" cy="42" r="16" fill="url(#c)"/><circle cx="82" cy="42" r="16" fill="url(#c)"/><circle cx="38" cy="41" r="11" fill="url(#w)"/><circle cx="82" cy="41" r="11" fill="url(#w)"/><g class="eyes"><circle cx="40" cy="42" r="6" fill="#2b2118"/><circle cx="84" cy="42" r="6" fill="#2b2118"/><circle cx="42" cy="40" r="2" fill="#fff"/><circle cx="86" cy="40" r="2" fill="#fff"/></g><ellipse cx="46" cy="62" rx="12" ry="5" fill="#fff" opacity="0.35" transform="rotate(-10 46 62)"/><path d="M44 74c8 8 24 8 32 0" stroke="#5e3f1c" stroke-width="3.5" fill="none" stroke-linecap="round"/><ellipse class="sac" cx="60" cy="88" rx="10" ry="6" fill="#f3d9a6"/><ellipse cx="30" cy="76" rx="6" ry="4" fill="#ff9aa8" opacity=".6"/><ellipse cx="90" cy="76" rx="6" ry="4" fill="#ff9aa8" opacity=".6"/></g></svg>